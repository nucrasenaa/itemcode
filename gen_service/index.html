<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ItemCode Results</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    main { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
    h1 { margin-bottom: 6px; }
    #status { color: #9ca3af; margin-bottom: 18px; }
    table { width: 100%; border-collapse: collapse; background: #1f2937; border-radius: 10px; overflow: hidden; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #374151; text-align: left; vertical-align: top; }
    th { background: #374151; color: #f9fafb; }
    td.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #93c5fd; white-space: nowrap; }
    td.detail { white-space: pre-wrap; word-break: break-word; }
    tr:last-child td { border-bottom: 0; }
    .empty { text-align: center; color: #9ca3af; padding: 32px; }
  </style>
</head>
<body>
  <main>
    <h1>ItemCode Results</h1>
    <div id="status">กำลังโหลด...</div>
    <table>
      <thead><tr><th>Code</th><th>Detail</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    async function loadItems() {
      const status = document.getElementById("status");
      const rows = document.getElementById("rows");
      try {
        const response = await fetch(`itemcode.json?t=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const items = await response.json();
        rows.replaceChildren();
        if (!items.length) {
          const row = document.createElement("tr");
          row.innerHTML = '<td class="empty" colspan="2">ยังไม่มี code ที่ใช้ได้</td>';
          rows.appendChild(row);
        } else {
          for (const item of items) {
            const row = document.createElement("tr");
            const code = document.createElement("td");
            code.className = "code";
            code.textContent = item.code || "";
            const detail = document.createElement("td");
            detail.className = "detail";
            detail.textContent = item.detail || "";
            row.append(code, detail);
            rows.appendChild(row);
          }
        }
        status.textContent = `พบ ${items.length} รายการ · อัปเดต ${new Date().toLocaleString("th-TH")}`;
      } catch (error) {
        status.textContent = `โหลดข้อมูลไม่สำเร็จ: ${error.message}`;
      }
    }
    loadItems();
    setInterval(loadItems, 5000);
  </script>
</body>
</html>
