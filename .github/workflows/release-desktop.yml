name: Release desktop app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
      - name: Select release platforms
        id: platforms
        run: |
          if git log -1 --format=%B | grep -Fq '[release-macos]'; then
            echo 'platforms=["macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi
      - name: Create release before platform publishers start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Equality ItemCode Watcher $GITHUB_REF_NAME" \
              --generate-notes
          fi

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      # Keep platform publishers serialized. The release is pre-created above
      # so electron-builder targets the same release instead of racing to
      # create split duplicate releases.
      fail-fast: true
      max-parallel: 1
      matrix:
        os: ${{ fromJSON(needs.prepare-release.outputs.platforms) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop-app/package-lock.json
            equality-itemcode-version/package-lock.json

      - name: Install service dependencies
        working-directory: equality-itemcode-version
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop-app
        run: npm ci

      - name: Test service and desktop
        run: |
          npm --prefix equality-itemcode-version test
          npm --prefix desktop-app run check

      - name: Compile macOS OCR helper
        if: runner.os == 'macOS'
        working-directory: equality-itemcode-version
        run: npm run build:ocr:mac

      - name: Build and publish
        working-directory: desktop-app
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
